# Déploiement Netlify — Messi Store (Next.js 16)
# Netlify détecte Next.js automatiquement et applique son runtime.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Variables à définir dans Netlify > Site configuration > Environment variables
# (elles doivent être créées dans l'interface : celles de ce fichier ne sont lues qu'au build) :
#   DATABASE_URL     chaîne PostgreSQL (Neon). Inutile avec Netlify DB : NETLIFY_DATABASE_URL est utilisée automatiquement.
#   ADMIN_PASSWORD   OBLIGATOIRE : mot de passe de l'espace admin (sans lui, la connexion est refusée)
#   ADMIN_SECRET     OBLIGATOIRE : longue chaîne aléatoire qui signe les sessions admin
#   ADMIN_EMAIL      optionnel : e-mail de l'administrateur

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
